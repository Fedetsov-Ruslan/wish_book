version: "3.8"

services:
  bot:
    container_name: bot
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"  # local API/frontend access without TLS, for dev iteration only —
                      # Telegram itself will only load the Mini App over the prod/Caddy https:// URL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dev-only: exposes `bot` over a free trycloudflare.com HTTPS URL so the
  # real Telegram client can open the Mini App without deploying to the
  # actual domain/Caddy. Reaches `bot` by its compose service name over the
  # shared network, so recreating `bot` doesn't break the tunnel (unlike
  # `--network container:bot`). The URL is random per start — read it with:
  #   docker compose logs cloudflared | grep trycloudflare
  # then set WEBAPP_URL in .env to it and re-run the menu-button setup.
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://bot:8000
    depends_on:
      - bot

  postgres:
    container_name: db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redis_data:
